<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一方小海 · 桌面景观</title><style>
:root{font-family:'Segoe UI','Microsoft YaHei',sans-serif;color:#365569;background:transparent}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}button,input,select{font:inherit}button,select{border:1px solid #bed1dc;border-radius:10px;padding:7px 10px;background:#f5faf9;color:#345568;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #d69448;outline-offset:2px}#toolbar{position:fixed;top:10px;left:50%;transform:translateX(-50%);max-width:95%;display:none;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;padding:8px;border:1px solid #bdd5df;border-radius:16px;background:#f4f9f6ed;font-size:12px;box-shadow:0 3px 12px #20384512}body[data-editing=true] #toolbar{display:flex}#drag{cursor:move;touch-action:none;user-select:none}#wave-size{width:75px;accent-color:#608fa1}#toolbar label,#gm-controls{display:flex;align-items:center;gap:5px}#gm-controls{flex-basis:100%;justify-content:center;border-top:1px solid #ccdcda;padding-top:7px}#gm-event{max-width:180px}#wave-value{width:34px;font-size:11px}#edit{position:fixed;right:12px;top:12px;display:none}body[data-native=false][data-editing=false] #edit{display:block}body[data-native=false] #drag,body[data-native=true] #qa-panel{display:none}#loading,#error{position:fixed;left:10%;right:10%;top:45%;padding:16px;border-radius:14px;background:#edf4eee8;text-align:center;font-size:13px}#loading[hidden],#error[hidden],[hidden]{display:none!important}#status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.credits{position:fixed;bottom:10px;left:12px;font-size:10px;display:none;background:#f4f9f6de;border-radius:9px;padding:6px}body[data-editing=true] .credits{display:block}.credits-panel{max-width:330px;max-height:220px;overflow:auto;font-size:11px}.credits a{color:inherit}#qa-panel{position:fixed;bottom:12px;right:12px;width:290px;max-height:40vh;overflow:auto;font:11px monospace;background:#f6faf3e8;padding:8px;border-radius:8px}#diagnostics{white-space:pre-wrap}body[data-wallpaper=light]{background:#f2f0e9}body[data-wallpaper=dark]{background:#15202e}body[data-wallpaper=checker]{background:repeating-conic-gradient(#aaa 0% 25%,#e9e9e9 0% 50%) 0/32px 32px}@media(max-width:500px){#toolbar{width:94%;font-size:11px;gap:4px}button,select{padding:6px 8px}}
body[data-journal=true][data-native] :is(#toolbar,#edit,.credits,#qa-panel){display:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
/* JOURNAL_STYLE */
</style></head><body data-native="true" data-editing="false">
<canvas id="scene" tabindex="0" aria-label="微缩海洋，船只持续航行；点击旁边的航海手账查看与装扮"></canvas>

<!-- JOURNAL_UI -->
<div id="toolbar" aria-label="编辑桌宠"><button id="drag">✥ 移动窗口</button><button id="reset">重置视角</button><button id="pause">暂停</button><button id="sound" aria-pressed="false">听海</button><select id="fps" aria-label="帧率"><option value="30">30 FPS</option><option value="20">20 FPS 节能</option></select><label>海浪<input id="wave-size" type="range" min="0" max="200" step="5" value="100" aria-label="海浪大小"><output id="wave-value">100%</output></label><button id="lock">锁定展示</button><!-- GM_START --><div id="gm-controls" hidden><strong>GM</strong><select id="gm-event" aria-label="选择见闻"><option value="random">随机见闻</option></select><button id="gm-trigger" type="button">立即出现</button></div><!-- GM_END --></div><button id="edit">编辑预览</button>
<div id="loading">正在打开小海…</div><div id="error" role="alert" hidden></div><span id="status" role="status"></span>
<details class="credits"><summary>声音来源</summary><div class="credits-panel"><strong>来自真实自然的声音</strong><p>已剪辑、柔化高频、降低响度；海浪与雨声循环交叠，雷声延迟轻响。</p><ul><li><a href="https://commons.wikimedia.org/wiki/File:Oceanwavescrushing.ogg" target="_blank" rel="noreferrer">Oceanwavescrushing — Luftrum</a></li><li><a href="https://commons.wikimedia.org/wiki/File:Larus_atricilla.ogg" target="_blank" rel="noreferrer">Larus atricilla — Tony Phillips</a></li><li><a href="https://commons.wikimedia.org/wiki/File:Thunder.ogg" target="_blank" rel="noreferrer">Thunder — Bidgee</a></li></ul><p>以上三段录音依照 <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noreferrer">CC BY 3.0</a> 使用并改编。</p><p><a href="https://commons.wikimedia.org/wiki/File:Rain_(1).ogg" target="_blank" rel="noreferrer">Rain (1) — ezwa / PDSounds</a> · 公共领域。</p></div></details>
<details id="qa-panel" hidden><summary>实测诊断</summary><label>测试底色<select id="wallpaper"><option value="checker">棋盘格</option><option value="light">浅色</option><option value="dark">深色</option></select></label><button id="export">导出结果</button><pre id="diagnostics"></pre></details>
